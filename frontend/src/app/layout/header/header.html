<header class="site-header">
  <div class="header-inner container">
    <a class="brand" routerLink="/" (click)="close()" aria-label="MAPA Asesorías Migratorias, inicio">
      <img
        src="media/img/mapa-logo.png"
        alt="MAPA Asesorías Migratorias"
        width="650"
        height="214"
      />
    </a>

    <nav class="desktop-nav" aria-label="Navegación principal">
      @for (item of menu; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [class.contact-link]="item.path === '/contact-4'"
          ariaCurrentWhenActive="page"
          >{{ item.label }}</a
        >
      }
    </nav>

    <button
      type="button"
      class="menu-toggle"
      #menuButton
      [class.is-open]="open()"
      [attr.aria-expanded]="open()"
      aria-controls="mobile-menu"
      [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggle()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

@if (open()) {
  <nav id="mobile-menu" class="mobile-nav container" aria-label="Navegación principal móvil">
    @for (item of menu; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="close()"
        >{{ item.label }}</a
      >
    }
  </nav>
}
